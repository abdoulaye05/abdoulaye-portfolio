<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdoulaye Diallo - Portfolio</title>

  <!-- Icône du site -->
  <link rel="icon" type="image/x-icon" href="/abdoulaye-portfolio/favicon.ico" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto:wght@100;300;400;500;700;900&display=swap"
          rel="stylesheet"
  />
</head>
<body>
<div id="root"></div>

<!-- Script pour charger dynamiquement le bon fichier JS -->
<script>
  fetch('/abdoulaye-portfolio/manifest.json')
          .then(response => response.json())
          .then(manifest => {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = `/abdoulaye-portfolio/${manifest['index.html'].file}`;
            document.body.appendChild(script);
          });
</script>
</body>
</html>
